name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    # the whole of ci.yml (tests, lint, scanners, CodeQL, ZAP, bench, fuzz, the stale-build checks): nothing goes
    # live while any of it fails (a hand-edited vendor/three.min.js or a stale standalone file included)
    uses: ./.github/workflows/ci.yml   # zizmor: ignore[self-repository] -- the documented form for a reusable workflow of this repository at this commit; actionlint checks it
    permissions:
      contents: read
      actions: read

  deploy:
    name: Deploy
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write      # upload the site to GitHub Pages
      id-token: write   # the Pages deployment proves it comes from this workflow (OIDC)
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true   # turns Pages on (source: GitHub Actions) the first time; a no-op after that
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts   # the pinned esbuild only (its binary comes as an optional package)
      - name: Assemble site (an include list; the modules minified)
        run: ./tools/assemble-site.sh
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  live:
    name: The live site (headers, Slow 4G load)
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24   # the Observatory needs Node 24
          cache: npm
      - run: npm ci
      - name: MDN HTTP Observatory tests on the game's page (fails on a test docs/threat-model.md does not accept)
        run: |
          npm ci --prefix tools/observatory --no-audit --no-fund --ignore-scripts
          npm --prefix tools/observatory/node_modules/@mdn/mdn-http-observatory run updateHsts   # the HSTS preload list (npm 11 runs no install script)
          node tools/check-live-site.mjs --site "$SITE" --out live-headers.json
        env:
          SITE: ${{ needs.deploy.outputs.page_url }}
      - run: npx playwright install --with-deps chromium
      - name: Slow 4G load of the live page (docs/budgets.md), against tools/bench-budgets-live.json
        run: node tools/device-bench.mjs --url "$SITE" --load-only --no-spector --check tools/bench-budgets-live.json > live-load.json
        env:
          SITE: ${{ needs.deploy.outputs.page_url }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: live
          path: |
            live-headers.json
            live-load.json
            bench/
