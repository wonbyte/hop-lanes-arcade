<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Hop Lanes Arcade</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@500;800&display=swap">
<style>
/* Layout: full-bleed 3D playfield, marquee bar on top, two-player control deck at the bottom. Single arcade look. */
:root {
  --bg: #10131c;
  --ink: #ffffff;
  --sky: #74d3f2;
  --gold: #ffd84a;
  --p1: #2453d6;
  --p1-glow: #4fb8ff;
  --p2: #d8402a;
  --p2-glow: #ff6f5a;
  --deck: #1b2030;
  --shade: rgba(10, 12, 20, .72);
  --font-pixel: "Press Start 2P", ui-monospace, "Courier New", monospace;
  --font-ui: "Rubik", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-ui); overflow: hidden;
  -webkit-user-select: none; user-select: none; touch-action: manipulation;
}
#app { position: relative; height: 100%; display: flex; flex-direction: column; }
#stage { position: relative; flex: 1; min-height: 0; }
#stage canvas { display: block; width: 100%; height: 100%; }

/* marquee */
#marquee {
  position: absolute; inset: 0 0 auto 0; z-index: 3;
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px;
  background: var(--sky); color: #1d3b6b;
  box-shadow: 0 4px 0 rgba(0,0,0,.25);
}
.hs { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.hs small { font-family: var(--font-pixel); font-size: clamp(7px, 1.9vw, 11px); letter-spacing: .08em; }
.hs b {
  font-family: var(--font-pixel); font-size: clamp(16px, 5vw, 30px); color: var(--gold);
  text-shadow: 2px 2px 0 #1d3b6b, -1px -1px 0 #1d3b6b, 1px -1px 0 #1d3b6b, -1px 1px 0 #1d3b6b;
  font-variant-numeric: tabular-nums;
}

/* live scores */
.score {
  position: absolute; z-index: 3; top: calc(env(safe-area-inset-top, 0px) + 84px);
  font-family: var(--font-pixel); font-size: clamp(18px, 5.5vw, 34px);
  color: var(--ink); text-shadow: 3px 3px 0 rgba(0,0,0,.55);
  font-variant-numeric: tabular-nums;
}
.score span { display: block; font-size: .35em; margin-bottom: 6px; letter-spacing: .1em; }
#score1 { left: 16px; } #score1 span { color: var(--p1-glow); }
#score2 { right: 16px; text-align: right; } #score2 span { color: var(--p2-glow); }

/* join cards */
#cards {
  position: absolute; z-index: 4; left: 16px; right: 16px; bottom: 18px;
  display: flex; justify-content: center; gap: clamp(16px, 8vw, 80px);
  pointer-events: none;
}
.card {
  width: min(40vw, 190px); padding: 12px 10px 10px; border-radius: 14px;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  font-family: var(--font-pixel); font-size: clamp(7px, 2.1vw, 11px); text-align: center; line-height: 1.5;
  box-shadow: 0 6px 0 rgba(0,0,0,.35); transition: transform .2s;
}
.card.p1 { background: var(--p1); }
.card.p2 { background: var(--p2); }
.card svg { width: 64%; height: auto; image-rendering: pixelated; }
.card.ready { animation: bob .6s ease-in-out infinite alternate; }
.card .state { color: var(--gold); }
@keyframes bob { to { transform: translateY(-6px); } }

/* center banners */
#banner {
  position: absolute; z-index: 5; left: 16px; right: 16px; top: 38%;
  text-align: center; font-family: var(--font-pixel); pointer-events: none;
}
#banner h1 {
  margin: 0; font-size: clamp(22px, 8vw, 54px); color: var(--gold); line-height: 1.2;
  text-shadow: 4px 4px 0 #1d3b6b; text-wrap: balance;
}
#banner p { margin: 14px 0 0; font-size: clamp(8px, 2.4vw, 13px); line-height: 1.8; text-shadow: 2px 2px 0 #000; }
#logo { position: absolute; z-index: 4; left: 16px; right: 16px; top: calc(env(safe-area-inset-top, 0px) + 92px); text-align: center; pointer-events: none; }
#logo div {
  display: inline-block; font-family: var(--font-pixel); font-size: clamp(22px, 7.5vw, 50px); line-height: 1.15;
  color: #fff; text-shadow: 0 5px 0 #b33a26, 4px 9px 0 rgba(0,0,0,.35); transform: rotate(-4deg);
}
#logo small { display: block; font-size: .32em; color: var(--gold); text-shadow: 2px 2px 0 #1d3b6b; margin-bottom: 8px; }

/* results */
#results {
  position: absolute; z-index: 6; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(88vw, 440px); padding: 22px 18px; border-radius: 16px;
  background: var(--shade); text-align: center; font-family: var(--font-pixel);
  display: flex; flex-direction: column; gap: 16px;
}
#results h2 { margin: 0; font-size: clamp(14px, 4.5vw, 24px); color: var(--gold); }
#results .row { display: flex; justify-content: space-around; gap: 12px; }
#results .row div { display: flex; flex-direction: column; gap: 8px; font-size: clamp(8px, 2.4vw, 12px); }
#results .row b { font-size: clamp(20px, 6vw, 34px); font-variant-numeric: tabular-nums; }
#results .r1 { color: var(--p1-glow); } #results .r2 { color: var(--p2-glow); }
#results p { margin: 0; font-size: clamp(7px, 2vw, 10px); line-height: 1.8; }

/* control deck */
#deck {
  position: relative; z-index: 7; background: var(--deck);
  border-top: 4px solid #5ee05a; box-shadow: 0 -6px 22px rgba(94,224,90,.35);
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;
  padding: 12px 16px calc(env(safe-area-inset-bottom, 0px) + 12px);
}
.pad { display: flex; align-items: center; justify-content: center; gap: 8px; }
.pad .lbl { font-family: var(--font-pixel); font-size: 8px; letter-spacing: .1em; }
.pad.p1 .lbl { color: var(--p1-glow); } .pad.p2 .lbl { color: var(--p2-glow); }
button { font: inherit; color: inherit; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.tap {
  width: clamp(64px, 18vw, 96px); aspect-ratio: 1; max-width: 100%; border-radius: 50%;
  font-family: var(--font-pixel); font-size: clamp(10px, 3vw, 15px); color: #10131c;
  border: 5px solid #0b0d14; transition: transform .06s, box-shadow .06s;
}
.p1 .tap { background: radial-gradient(circle at 40% 35%, #b9ecff, var(--p1-glow) 55%, #1e74c9); box-shadow: 0 6px 0 #0b3b6e, 0 0 20px var(--p1-glow); }
.p2 .tap { background: radial-gradient(circle at 40% 35%, #ffd0c6, var(--p2-glow) 55%, #b4261a); box-shadow: 0 6px 0 #6e140b, 0 0 20px var(--p2-glow); }
.tap.down { transform: translateY(5px); box-shadow: 0 1px 0 #000 !important; }
.side {
  width: clamp(30px, 8vw, 42px); aspect-ratio: 1; border-radius: 10px; background: #2c3348; color: #c9d2ea;
  font-size: clamp(12px, 3.4vw, 18px); box-shadow: 0 4px 0 #0b0d14;
}
.side:active { transform: translateY(3px); box-shadow: 0 1px 0 #0b0d14; }
#start {
  font-family: var(--font-pixel); font-size: 8px; padding: 10px 10px; border-radius: 6px;
  background: #e9ecf3; color: #10131c; box-shadow: 0 4px 0 #6b7080;
}
#start:active { transform: translateY(3px); box-shadow: 0 1px 0 #6b7080; }
.pad-col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
#keys { font-family: var(--font-pixel); font-size: 7px; color: #7d86a3; text-align: center; line-height: 1.8; }
@media (max-width: 520px) { #keys { display: none; } }
@media (prefers-reduced-motion: reduce) { .card.ready { animation: none; } }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="marquee">
      <div class="hs"><small>ALL TIME BEST</small><b id="best">0</b></div>
      <div class="hs"><small>TODAY'S BEST</small><b id="daily">0</b></div>
    </div>
    <div id="score1" class="score" hidden><span>P1 FROG</span><b>0</b></div>
    <div id="score2" class="score" hidden><span>P2 FOX</span><b>0</b></div>
    <div id="logo"><div><small>ARCADE</small>HOP<br>LANES</div></div>
    <div id="banner" hidden><h1></h1><p></p></div>
    <div id="results" hidden>
      <h2 id="resTitle">GAME OVER</h2>
      <div class="row">
        <div class="r1" id="res1"><span>FROG</span><b>0</b></div>
        <div class="r2" id="res2"><span>FOX</span><b>0</b></div>
      </div>
      <p id="resNote"></p>
    </div>
    <div id="cards">
      <div class="card p1" id="card1">
        <div>PRESS TAP<br>TO JOIN</div>
        <svg id="pic1" viewBox="0 0 12 12" shape-rendering="crispEdges" aria-hidden="true"></svg>
        <div class="state">FREE PLAY</div>
      </div>
      <div class="card p2" id="card2">
        <div>PRESS TAP<br>TO JOIN</div>
        <svg id="pic2" viewBox="0 0 12 12" shape-rendering="crispEdges" aria-hidden="true"></svg>
        <div class="state">FREE PLAY</div>
      </div>
    </div>
  </div>
  <div id="deck">
    <div class="pad p1">
      <button class="side" data-p="0" data-dx="-1" aria-label="Player 1 left">&#9664;</button>
      <div class="pad-col"><button class="tap" id="tap1" data-p="0" aria-label="Player 1 hop forward">TAP</button><span class="lbl">PLAYER 1</span></div>
      <button class="side" data-p="0" data-dx="1" aria-label="Player 1 right">&#9654;</button>
    </div>
    <div class="pad-col">
      <button id="start">START</button>
      <div id="keys">P1 W A S D<br>P2 ARROWS<br>SPACE START</div>
    </div>
    <div class="pad p2">
      <button class="side" data-p="1" data-dx="-1" aria-label="Player 2 left">&#9664;</button>
      <div class="pad-col"><button class="tap" id="tap2" data-p="1" aria-label="Player 2 hop forward">TAP</button><span class="lbl">PLAYER 2</span></div>
      <button class="side" data-p="1" data-dx="1" aria-label="Player 2 right">&#9654;</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';

// ---------- constants ----------
const PLAY_HALF = 4;          // playable columns: -4..4
const EDGE_DEATH = 5.4;       // carried this far on a log = swept away
const WRAP = 15;              // traffic wraps at +-WRAP
const HOP_TIME = 0.12;
const $ = id => document.getElementById(id);

// ---------- storage (best effort) ----------
const today = new Date().toISOString().slice(0, 10);
function load(k) { try { return +localStorage.getItem(k) || 0; } catch (e) { return 0; } }
function save(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) {} }
let bestAll = load('hoplanes.best');
let bestDay = load('hoplanes.day.' + today);
function showBests() { $('best').textContent = bestAll; $('daily').textContent = bestDay; }
showBests();

// ---------- pixel portraits for the join cards (original characters) ----------
const PIX = {
  frog: { rows: [
    '............',
    '..WWW..WWW..',
    '..WKW..WKW..',
    '.GGGGGGGGGG.',
    '.GGGGGGGGGG.',
    '.GRRRRRRRRG.',
    '.GGGGGGGGGG.',
    '.GLLLLLLLLG.',
    '.GLLLLLLLLG.',
    '.DD.DD.DD.DD',
    '............',
    '............'],
    pal: { W: '#fff', K: '#111', G: '#4cbf3f', R: '#e0453a', L: '#a6e37a', D: '#2d7a25' } },
  fox: { rows: [
    '.K........K.',
    '.OO......OO.',
    '.OOOOOOOOOO.',
    '.OOKOOOOKOO.',
    '.OOOOOOOOOO.',
    '.OOWWWWWWOO.',
    '.OWWWKKWWWO.',
    '.OOWWWWWWOO.',
    '.OOOWWWWOOO.',
    '.OOOOOOOOOO.',
    '..KK....KK..',
    '............'],
    pal: { O: '#f07a2a', W: '#fff4e6', K: '#1a1a1a' } }
};
function drawPix(svg, art) {
  let s = '';
  art.rows.forEach((r, y) => [...r].forEach((c, x) => {
    if (c !== '.') s += `<rect x="${x}" y="${y}" width="1" height="1" fill="${art.pal[c]}"/>`;
  }));
  svg.innerHTML = s;
}
drawPix($('pic1'), PIX.frog);
drawPix($('pic2'), PIX.fox);

// ---------- audio ----------
let actx = null;
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === 'suspended') actx.resume();
}
function beep(freq, dur, type = 'square', vol = 0.06, slide = 0) {
  if (!actx) return;
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
}
const sfx = {
  hop: p => beep(p ? 520 : 440, 0.07, 'square', 0.04, 200),
  squash: () => { beep(160, 0.25, 'sawtooth', 0.08, -120); },
  splash: () => { beep(900, 0.3, 'triangle', 0.06, -800); },
  bell: () => beep(1250, 0.08, 'square', 0.025),
  horn: () => { beep(220, 0.5, 'sawtooth', 0.05); beep(277, 0.5, 'sawtooth', 0.04); },
  join: () => { beep(660, 0.08); setTimeout(() => beep(990, 0.12), 80); },
  go: () => beep(880, 0.25, 'square', 0.06),
  tick: () => beep(440, 0.1, 'square', 0.05)
};

// ---------- three.js setup ----------
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x74d3f2);
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 100);
const CAM_OFF = new THREE.Vector3(3.2, 12, 7.5);

scene.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 0.65));
const sun = new THREE.DirectionalLight(0xffffff, 0.6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 18, bottom: -18, near: 1, far: 50 });
scene.add(sun, sun.target);

let viewHalfW = 6.5;
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  const aspect = w / h;
  viewHalfW = aspect < 0.8 ? 6.2 : 7.2;
  const halfH = viewHalfW / aspect;
  Object.assign(camera, { left: -viewHalfW, right: viewHalfW, top: halfH, bottom: -halfH });
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

const matCache = {};
function mat(color) {
  return matCache[color] || (matCache[color] = new THREE.MeshLambertMaterial({ color }));
}
const boxGeo = new THREE.BoxGeometry(1, 1, 1);
function box(w, h, d, color, x = 0, y = 0, z = 0, shadow = true) {
  const m = new THREE.Mesh(boxGeo, mat(color));
  m.scale.set(w, h, d); m.position.set(x, y + h / 2, z);
  m.castShadow = shadow; m.receiveShadow = true;
  return m;
}

// ---------- random ----------
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

// ---------- models ----------
function makeFrog() {
  const g = new THREE.Group(), b = new THREE.Group();
  b.add(box(0.62, 0.36, 0.62, 0x4cbf3f, 0, 0.08, 0));
  b.add(box(0.5, 0.06, 0.5, 0xa6e37a, 0, 0.02, 0));          // belly
  b.add(box(0.5, 0.05, 0.04, 0xe0453a, 0, 0.22, -0.31));      // mouth
  for (const s of [-1, 1]) {
    b.add(box(0.2, 0.2, 0.2, 0xffffff, s * 0.17, 0.42, -0.16));
    b.add(box(0.08, 0.1, 0.06, 0x111111, s * 0.17, 0.48, -0.27));
    b.add(box(0.16, 0.12, 0.3, 0x2d7a25, s * 0.33, 0, 0.12));  // back legs
    b.add(box(0.1, 0.1, 0.12, 0x2d7a25, s * 0.22, 0, -0.32));  // front feet
  }
  g.add(b); g.userData.body = b; return g;
}
function makeFox() {
  const g = new THREE.Group(), b = new THREE.Group();
  b.add(box(0.5, 0.5, 0.56, 0xf07a2a, 0, 0.1, 0));
  b.add(box(0.36, 0.3, 0.06, 0xfff4e6, 0, 0.12, -0.29));      // chest
  b.add(box(0.26, 0.16, 0.22, 0xfff4e6, 0, 0.3, -0.36));      // snout
  b.add(box(0.08, 0.07, 0.06, 0x1a1a1a, 0, 0.42, -0.47));     // nose
  for (const s of [-1, 1]) {
    b.add(box(0.07, 0.09, 0.04, 0x1a1a1a, s * 0.15, 0.46, -0.28)); // eyes
    b.add(box(0.14, 0.18, 0.1, 0xf07a2a, s * 0.16, 0.6, -0.05));   // ears
    b.add(box(0.14, 0.06, 0.1, 0x1a1a1a, s * 0.16, 0.78, -0.05));
    b.add(box(0.1, 0.12, 0.1, 0x1a1a1a, s * 0.14, 0, -0.12));      // legs
  }
  b.add(box(0.18, 0.18, 0.34, 0xf07a2a, 0, 0.25, 0.42));      // tail
  b.add(box(0.16, 0.16, 0.12, 0xfff4e6, 0, 0.26, 0.64));
  g.add(b); g.userData.body = b; return g;
}
const CAR_COLORS = [0xe8513a, 0x3a8ee8, 0xf2c33a, 0x8f5ae0, 0x3ac27a, 0xf27fb0];
function makeVehicle(truck) {
  const g = new THREE.Group(), c = pick(CAR_COLORS);
  let len;
  if (truck) {
    len = 2.4;
    g.add(box(1.7, 0.75, 0.8, 0xeeeeee, 0.3, 0.12, 0));
    g.add(box(0.6, 0.6, 0.78, c, -0.85, 0.12, 0));
    g.add(box(0.12, 0.3, 0.66, 0x223344, -1.12, 0.38, 0));
  } else {
    len = 1.4;
    g.add(box(1.4, 0.42, 0.78, c, 0, 0.12, 0));
    g.add(box(0.75, 0.3, 0.66, 0xffffff, 0.08, 0.54, 0));
    g.add(box(0.06, 0.2, 0.6, 0x223344, -0.3, 0.58, 0));
  }
  for (const wx of [-len / 2 + 0.3, len / 2 - 0.3]) for (const wz of [-0.38, 0.38])
    g.add(box(0.3, 0.26, 0.1, 0x222222, wx, 0, wz));
  return { mesh: g, len };
}
function makeLog(len) {
  const g = new THREE.Group();
  g.add(box(len, 0.26, 0.78, 0x8a5130, 0, -0.16, 0));
  g.add(box(0.12, 0.27, 0.7, 0xc08a5a, -len / 2 + 0.05, -0.16, 0, false));
  g.add(box(0.12, 0.27, 0.7, 0xc08a5a, len / 2 - 0.05, -0.16, 0, false));
  return g;
}
function makeTree(h) {
  const g = new THREE.Group();
  g.add(box(0.3, 0.3, 0.3, 0x7a4b2a, 0, 0, 0));
  g.add(box(0.72, h, 0.72, 0xa9cf3a, 0, 0.3, 0));
  return g;
}
function makeTrain(dir) {
  const g = new THREE.Group(); const cars = 4, cl = 3.0, gap = 0.15;
  const len = cars * cl + (cars - 1) * gap;
  for (let i = 0; i < cars; i++) {
    const x = -len / 2 + cl / 2 + i * (cl + gap);
    const front = dir > 0 ? i === cars - 1 : i === 0;
    g.add(box(cl, 0.9, 0.84, front ? 0xd83a3a : 0x3a6fd8, x, 0.12, 0));
    g.add(box(cl - 0.3, 0.2, 0.86, 0xdde6ff, x, 0.62, 0, false));
  }
  for (let i = 0; i < cars * 2; i++) g.add(box(0.4, 0.15, 0.9, 0x222222, -len / 2 + 0.6 + i * (len - 1.2) / (cars * 2 - 1), 0, 0, false));
  return { mesh: g, len };
}

// ---------- world ----------
let lanes = new Map();
let maxRow = -1;
let worldGroup = new THREE.Group();
scene.add(worldGroup);
let lastKind = 'grass', streak = 0;

function laneKind(r) {
  if (r < 4) return 'grass';
  const diff = Math.min(1, r / 120);
  let k;
  // keep runs of the same type together, like real roads and rivers
  if (lastKind !== 'grass' && streak < (lastKind === 'road' ? 4 : 3) && Math.random() < 0.55) k = lastKind;
  else {
    const w = { grass: 0.32 - diff * 0.12, road: 0.36, river: 0.2 + diff * 0.06, rail: 0.12 + diff * 0.06 };
    let x = Math.random() * (w.grass + w.road + w.river + w.rail);
    k = 'grass';
    for (const key of ['grass', 'road', 'river', 'rail']) { if ((x -= w[key]) < 0) { k = key; break; } }
    if (k === lastKind && k === 'grass') k = pick(['road', 'river', 'grass']);
  }
  streak = k === lastKind ? streak + 1 : 1;
  lastKind = k;
  return k;
}

function addLane(r) {
  const kind = laneKind(r);
  const prev = lanes.get(r - 1);
  const z = -r;
  const g = new THREE.Group();
  const lane = { r, kind, group: g, objs: [], trees: new Set(), dir: Math.random() < 0.5 ? 1 : -1, speed: 0 };
  const diff = Math.min(1, r / 150);

  if (kind === 'grass') {
    const shade = r % 2 ? 0xb7e05a : 0xaedb4f;
    g.add(box(40, 0.3, 1, shade, 0, -0.3, z, false));
    for (let x = -12; x <= 12; x++) {
      const out = Math.abs(x) > PLAY_HALF;
      if (out ? Math.random() < 0.85 : (r > 1 && Math.random() < 0.16 + diff * 0.08)) {
        lane.trees.add(x);
        const tree = makeTree(pick([0.6, 0.9, 1.2, 1.5]));
        tree.position.set(x, 0, z);
        g.add(tree);
      }
    }
    // never wall off a whole row
    if ([...lane.trees].filter(x => Math.abs(x) <= PLAY_HALF).length > 5) {
      for (const x of [-1, 0, 1]) lane.trees.delete(x);
      g.children.slice(1).forEach(t => { if (Math.abs(t.position.x) <= 1) g.remove(t); });
    }
  } else if (kind === 'road') {
    g.add(box(40, 0.3, 1, 0x4a4f5c, 0, -0.3, z, false));
    if (prev && prev.kind === 'road')
      for (let x = -12; x <= 12; x += 2) g.add(box(0.8, 0.02, 0.08, 0xe8e8e8, x, 0, z + 0.5, false));
    lane.speed = rand(1.6, 2.8) + diff * 2.4;
    const truckLane = Math.random() < 0.3;
    let x = rand(-WRAP, -WRAP + 3);
    const count = Math.floor(rand(2, 4) + diff * 1.5);
    const spacing = (WRAP * 2) / count;
    for (let i = 0; i < count; i++) {
      const v = makeVehicle(truckLane);
      v.x = x + i * spacing + rand(0, spacing * 0.35);
      v.mesh.rotation.y = lane.dir > 0 ? 0 : Math.PI;
      v.mesh.position.set(v.x, 0, z);
      g.add(v.mesh); lane.objs.push(v);
    }
  } else if (kind === 'river') {
    const water = box(40, 0.3, 1, 0x5ec8f0, 0, -0.45, z, false);
    g.add(water);
    if (prev && prev.kind === 'river') lane.dir = -prev.dir;
    lane.speed = rand(1.0, 1.9) + diff * 1.0;
    const count = Math.max(3, Math.floor(rand(4, 6) - diff * 2));
    const spacing = (WRAP * 2) / count;
    const x0 = rand(-WRAP, -WRAP + 2);
    for (let i = 0; i < count; i++) {
      const len = pick([2, 3, 3, 4]) - (diff > 0.6 && Math.random() < 0.5 ? 1 : 0);
      const lg = { mesh: makeLog(len), len, x: x0 + i * spacing };
      lg.mesh.position.set(lg.x, 0, z);
      g.add(lg.mesh); lane.objs.push(lg);
    }
  } else if (kind === 'rail') {
    g.add(box(40, 0.3, 1, 0x7b6f6a, 0, -0.3, z, false));
    for (let x = -14; x <= 14; x += 0.7) g.add(box(0.18, 0.06, 0.9, 0x5a3d2a, x, 0, z, false));
    g.add(box(40, 0.06, 0.08, 0x9aa3b5, 0, 0.05, z - 0.28, false));
    g.add(box(40, 0.06, 0.08, 0x9aa3b5, 0, 0.05, z + 0.28, false));
    const poleX = PLAY_HALF + 0.6;
    g.add(box(0.12, 1.3, 0.12, 0xeeeeee, poleX, 0, z + 0.45));
    const light = box(0.38, 0.2, 0.14, 0x222222, poleX, 1.1, z + 0.45);
    light.material = new THREE.MeshLambertMaterial({ color: 0x331111, emissive: 0x000000 });
    g.add(light);
    lane.light = light;
    lane.timer = rand(2, 6);
    const t = makeTrain(lane.dir);
    lane.train = { mesh: t.mesh, len: t.len, x: 99, active: false };
    t.mesh.position.set(99, 0, z); t.mesh.visible = false;
    g.add(t.mesh);
  }
  worldGroup.add(g);
  lanes.set(r, lane);
  maxRow = Math.max(maxRow, r);
}

function updateLanes(dt) {
  for (const lane of lanes.values()) {
    if (lane.kind === 'road' || lane.kind === 'river') {
      for (const o of lane.objs) {
        o.x += lane.dir * lane.speed * dt;
        if (o.x > WRAP + o.len / 2) o.x -= WRAP * 2 + o.len;
        if (o.x < -WRAP - o.len / 2) o.x += WRAP * 2 + o.len;
        o.mesh.position.x = o.x;
        if (lane.kind === 'river') o.mesh.position.y = Math.sin(performance.now() / 400 + o.x) * 0.02;
      }
    } else if (lane.kind === 'rail') {
      const tr = lane.train;
      if (!tr.active) {
        lane.timer -= dt;
        const warn = lane.timer < 1.3;
        const on = warn && Math.floor(lane.timer * 8) % 2 === 0;
        lane.light.material.emissive.setHex(on ? 0xff2222 : 0x000000);
        if (warn && !lane.warned) { lane.warned = true; if (near(lane.r)) sfx.horn(); }
        if (on && near(lane.r) && Math.floor(lane.timer * 8) !== lane.lastBell) { lane.lastBell = Math.floor(lane.timer * 8); sfx.bell(); }
        if (lane.timer <= 0) {
          tr.active = true; tr.x = -lane.dir * (WRAP + tr.len / 2 + 2);
          tr.mesh.visible = true;
        }
      } else {
        tr.x += lane.dir * 26 * dt;
        tr.mesh.position.x = tr.x;
        lane.light.material.emissive.setHex(Math.floor(performance.now() / 120) % 2 ? 0xff2222 : 0x000000);
        if (Math.abs(tr.x) > WRAP + tr.len / 2 + 3) {
          tr.active = false; tr.mesh.visible = false; lane.warned = false;
          lane.timer = rand(3.5, 8);
        }
      }
    }
  }
}
const near = r => Math.abs(r - camRow) < 14 && state === 'play';

function resetWorld() {
  scene.remove(worldGroup);
  worldGroup = new THREE.Group();
  scene.add(worldGroup);
  lanes = new Map(); maxRow = -1; lastKind = 'grass'; streak = 0;
  for (let r = -8; r < 26; r++) addLane(r);
}
function ensureLanes() {
  while (maxRow < camRow + 26) addLane(maxRow + 1);
  for (const [r, lane] of lanes) if (r < camRow - 12) { worldGroup.remove(lane.group); lanes.delete(r); }
}

// ---------- players ----------
const players = [
  { id: 0, name: 'FROG', make: makeFrog, startX: -2, joined: false },
  { id: 1, name: 'FOX', make: makeFox, startX: 2, joined: false }
];
function spawn(p) {
  if (p.mesh) scene.remove(p.mesh);
  p.mesh = p.make();
  p.mesh.traverse(m => { if (m.isMesh) m.castShadow = true; });
  scene.add(p.mesh);
  Object.assign(p, { x: p.startX, row: 0, alive: true, hop: null, queue: null, score: 0, facing: Math.PI, deadT: 0, cause: '' });
  p.mesh.position.set(p.x, 0, 0);
}
function despawn(p) { if (p.mesh) { scene.remove(p.mesh); p.mesh = null; } p.alive = false; }

function tryMove(p, dx, dr) {
  if (!p.alive) return;
  if (p.hop) { p.queue = [dx, dr]; return; }
  const lane = lanes.get(p.row + dr);
  p.facing = dr > 0 ? Math.PI : dr < 0 ? 0 : (dx > 0 ? -Math.PI / 2 : Math.PI / 2);
  if (!lane) return;
  let tx = p.x + dx;
  if (lane.kind !== 'river') tx = Math.round(tx);
  if (Math.abs(Math.round(tx)) > PLAY_HALF && lane.kind !== 'river') return;
  if (lane.kind === 'river' && Math.abs(tx) > PLAY_HALF + 0.5) return;
  if (lane.kind === 'grass' && lane.trees.has(tx)) return;
  if (p.row + dr < camRow - 5) return;
  p.hop = { t: 0, fx: p.x, fz: -p.row, tx, tz: -(p.row + dr), fy: p.mesh.position.y };
  p.row += dr;
  if (p.row > p.score) {
    p.score = p.row;
    $('score' + (p.id + 1)).querySelector('b').textContent = p.score;
  }
  sfx.hop(p.id);
}

function kill(p, cause) {
  if (!p.alive) return;
  p.alive = false; p.cause = cause; p.deadT = 0; p.hop = null;
  const b = p.mesh.userData.body;
  if (cause === 'squash') { b.scale.set(1.35, 0.15, 1.35); sfx.squash(); }
  else if (cause === 'splash') { sfx.splash(); splash(p.mesh.position.x, -p.row); }
  else sfx.squash();
  checkOver();
}

const parts = [];
function splash(x, z) {
  for (let i = 0; i < 12; i++) {
    const m = box(0.14, 0.14, 0.14, 0xffffff, x, 0, z, false);
    m.userData.v = new THREE.Vector3(rand(-2, 2), rand(3, 5), rand(-2, 2));
    scene.add(m); parts.push(m);
  }
}

function updatePlayer(p, dt) {
  if (!p.mesh) return;
  const m = p.mesh, body = m.userData.body;
  m.rotation.y += ((p.facing - m.rotation.y + Math.PI * 3) % (Math.PI * 2) - Math.PI) * Math.min(1, dt * 25);

  if (!p.alive) {
    p.deadT += dt;
    if (p.cause === 'splash') m.position.y = Math.max(-1.2, m.position.y - dt * 2.5);
    if (p.cause === 'swept') { m.position.y -= dt * 4; m.position.x += Math.sign(m.position.x) * dt * 2; }
    if (p.cause === 'train') { m.position.x += p.trainDir * dt * 26; m.rotation.z += dt * 12; }
    return;
  }

  const lane = lanes.get(p.row);
  if (p.hop) {
    const h = p.hop;
    h.t += dt / HOP_TIME;
    const t = Math.min(1, h.t);
    p.x = h.fx + (h.tx - h.fx) * t;
    m.position.set(p.x, Math.sin(t * Math.PI) * 0.45, h.fz + (h.tz - h.fz) * t);
    body.scale.set(1, 1, 1);
    if (t >= 1) {
      p.hop = null;
      if (lane && lane.kind === 'river') {
        const log = lane.objs.find(o => Math.abs(o.x - p.x) < o.len / 2 + 0.05);
        if (!log) { kill(p, 'splash'); return; }
        // snap onto the nearest log segment so standing feels solid
        const rel = p.x - log.x, half = log.len / 2 - 0.5;
        p.logOff = Math.max(-half, Math.min(half, Math.round(rel - (log.len % 2 ? 0 : 0.5)) + (log.len % 2 ? 0 : 0.5)));
        p.log = log;
      } else { p.log = null; p.x = Math.round(p.x); }
      body.scale.set(1.15, 0.8, 1.15);
      if (p.queue) { const q = p.queue; p.queue = null; tryMove(p, q[0], q[1]); }
    }
  } else {
    body.scale.lerp(new THREE.Vector3(1, 1, 1), Math.min(1, dt * 14));
    if (lane && lane.kind === 'river') {
      if (p.log && lane.objs.includes(p.log)) p.x = p.log.x + p.logOff;
      m.position.x = p.x; m.position.y = 0.1;
      if (Math.abs(p.x) > EDGE_DEATH) { kill(p, 'swept'); return; }
    } else { m.position.y = 0; }
  }

  if (!lane) return;
  if (lane.kind === 'road') {
    for (const o of lane.objs) if (Math.abs(o.x - p.x) < o.len / 2 + 0.28) { kill(p, 'squash'); return; }
  } else if (lane.kind === 'rail' && lane.train.active) {
    if (Math.abs(lane.train.x - p.x) < lane.train.len / 2 + 0.3) { p.trainDir = lane.dir; kill(p, 'train'); return; }
  }
  if (p.row < camRow - 4.5) kill(p, 'slow');
}

// ---------- game state ----------
let state = 'attract', stateT = 0, camRow = 0, camX = 0, playT = 0, countdown = 0;

function setBanner(h, p) {
  const b = $('banner');
  if (!h) { b.hidden = true; return; }
  b.hidden = false; b.querySelector('h1').textContent = h; b.querySelector('p').innerHTML = p || '';
}
function setCard(i) {
  const c = $('card' + (i + 1)), p = players[i];
  const head = c.firstElementChild, st = c.lastElementChild;
  c.classList.toggle('ready', p.joined && state !== 'play');
  if (state === 'play' || state === 'over') {
    c.style.visibility = 'hidden';
  } else {
    c.style.visibility = 'visible';
    head.innerHTML = p.joined ? 'READY!' : 'PRESS TAP<br>TO JOIN';
    st.textContent = p.joined ? 'PLAYER ' + (i + 1) : 'FREE PLAY';
  }
}

function toAttract() {
  state = 'attract'; stateT = 0;
  players.forEach(p => { p.joined = false; despawn(p); });
  camRow = 0;
  resetWorld();
  $('results').hidden = true; $('logo').hidden = false;
  $('score1').hidden = $('score2').hidden = true;
  setBanner(null);
  setCard(0); setCard(1);
}
function join(i) {
  const p = players[i];
  if (p.joined) return;
  p.joined = true; sfx.join();
  spawn(p);
  if (state === 'attract') { state = 'countdown'; countdown = 3.99; }
  else countdown = Math.max(countdown, 2.5);
  $('logo').hidden = true;
  setCard(0); setCard(1);
}
function startPlay() {
  state = 'play'; playT = 0; sfx.go();
  setBanner(null);
  players.forEach((p, i) => {
    const s = $('score' + (i + 1));
    s.hidden = !p.joined; s.querySelector('b').textContent = '0';
  });
  setCard(0); setCard(1);
}
function checkOver() {
  if (state !== 'play') return;
  if (players.some(p => p.joined && p.alive)) return;
  state = 'over'; stateT = 0;
  const joined = players.filter(p => p.joined);
  const top = Math.max(...joined.map(p => p.score));
  let note = '';
  if (top > bestAll) { bestAll = top; save('hoplanes.best', top); note = 'NEW ALL TIME BEST!'; }
  if (top > bestDay) { bestDay = top; save('hoplanes.day.' + today, top); note = note || "NEW BEST TODAY!"; }
  showBests();
  setTimeout(() => {
    if (state !== 'over') return;
    const both = joined.length === 2;
    $('resTitle').textContent = !both ? 'GAME OVER'
      : players[0].score === players[1].score ? 'TIE GAME!'
      : (players[0].score > players[1].score ? 'FROG WINS!' : 'FOX WINS!');
    $('res1').hidden = !players[0].joined; $('res2').hidden = !players[1].joined;
    $('res1').querySelector('b').textContent = players[0].score;
    $('res2').querySelector('b').textContent = players[1].score;
    $('resNote').textContent = (note ? note + ' ' : '') + 'PRESS TAP TO PLAY AGAIN';
    $('results').hidden = false;
  }, 1100);
}

function press(i, dx, dr) {
  audio();
  if (state === 'attract' || state === 'countdown') { join(i); return; }
  if (state === 'over') { if (stateT > 2) toAttract(), join(i); return; }
  const p = players[i];
  if (p.joined) tryMove(p, dx, dr);
}
function pressStart() {
  audio();
  if (state === 'attract') { join(0); }
  else if (state === 'countdown') countdown = Math.min(countdown, 0.01);
  else if (state === 'over' && stateT > 1) toAttract();
}

// ---------- input ----------
const KEYS = {
  KeyW: [0, 0, 1], KeyS: [0, 0, -1], KeyA: [0, -1, 0], KeyD: [0, 1, 0],
  ArrowUp: [1, 0, 1], ArrowDown: [1, 0, -1], ArrowLeft: [1, -1, 0], ArrowRight: [1, 1, 0]
};
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  const k = KEYS[e.code];
  if (k) { e.preventDefault(); press(k[0], k[1], k[2]); }
  else if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); pressStart(); }
});
document.querySelectorAll('.tap').forEach(btn => {
  const i = +btn.dataset.p;
  btn.addEventListener('pointerdown', e => { e.preventDefault(); btn.classList.add('down'); press(i, 0, 1); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => btn.addEventListener(t, () => btn.classList.remove('down')));
});
document.querySelectorAll('.side').forEach(btn => {
  btn.addEventListener('pointerdown', e => { e.preventDefault(); press(+btn.dataset.p, +btn.dataset.dx, 0); });
});
$('start').addEventListener('click', pressStart);
document.addEventListener('contextmenu', e => e.preventDefault());

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now; stateT += dt;

  if (state === 'countdown') {
    const before = Math.ceil(countdown);
    countdown -= dt;
    const n = Math.ceil(countdown);
    if (n !== before && n > 0) sfx.tick();
    setBanner(n > 0 ? String(n) : 'GO!', players.every(p => p.joined) ? 'FROG VS FOX' : 'OTHER PLAYER: PRESS TAP TO JOIN');
    if (countdown <= 0) startPlay();
  }

  if (state === 'play') {
    playT += dt;
    const alive = players.filter(p => p.joined && p.alive);
    const lead = alive.length ? Math.max(...alive.map(p => p.row)) : camRow;
    // the camera creeps forward on its own, and catches up fast to a player who runs ahead
    const creep = Math.min(1.1, 0.3 + playT * 0.006);
    camRow += creep * dt;
    const want = lead - 2;
    if (want > camRow) camRow += (want - camRow) * Math.min(1, dt * 3);
  } else if (state === 'attract') {
    camRow += (0 - camRow) * Math.min(1, dt * 2);
  }

  ensureLanes();
  updateLanes(dt);
  players.forEach(p => updatePlayer(p, dt));
  for (let i = parts.length - 1; i >= 0; i--) {
    const m = parts[i]; m.userData.v.y -= 14 * dt;
    m.position.addScaledVector(m.userData.v, dt);
    if (m.position.y < -1) { scene.remove(m); parts.splice(i, 1); }
  }

  // camera: look a few rows ahead of the scroll line
  const focus = new THREE.Vector3(camX, 0, -(camRow + 4.2));
  camera.position.copy(focus).add(CAM_OFF);
  camera.lookAt(focus);
  sun.position.set(focus.x - 6, 14, focus.z + 6);
  sun.target.position.copy(focus);

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

window.hopLanes = { players, get state() { return state; }, get camRow() { return camRow; } };
toAttract();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
