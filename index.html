<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Hop Lanes Arcade</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@500;800&display=swap">
<style>
/* Layout: full-bleed 3D playfield, marquee bar on top, two-player control deck at the bottom. Single arcade look. */
:root {
  --bg: #10131c;
  --ink: #ffffff;
  --sky: #74d3f2;
  --gold: #ffd84a;
  --p1: #2453d6;
  --p1-glow: #4fb8ff;
  --p2: #d8402a;
  --p2-glow: #ff6f5a;
  --deck: #1b2030;
  --shade: rgba(10, 12, 20, .72);
  --font-pixel: "Press Start 2P", ui-monospace, "Courier New", monospace;
  --font-ui: "Rubik", system-ui, sans-serif;
  color-scheme: dark;
}
/* safe areas are padded once, on the root (matches the artifact host's own reset) */
html { box-sizing: border-box; padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-ui); overflow: hidden;
  -webkit-user-select: none; user-select: none; touch-action: manipulation;
}
#app { position: relative; height: 100%; display: flex; flex-direction: column; }
#stage { position: relative; flex: 1; min-height: 0; }
#stage canvas { display: block; width: 100%; height: 100%; }

/* marquee */
#marquee {
  position: absolute; inset: 0 0 auto 0; z-index: 3;
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  padding: 10px 16px;
  background: var(--sky); color: #1d3b6b;
  box-shadow: 0 4px 0 rgba(0,0,0,.25);
}
.hs { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.hs small { font-family: var(--font-pixel); font-size: clamp(7px, 1.9vw, 11px); letter-spacing: .08em; }
.hs b {
  font-family: var(--font-pixel); font-size: clamp(16px, 5vw, 30px); color: var(--gold);
  text-shadow: 2px 2px 0 #1d3b6b, -1px -1px 0 #1d3b6b, 1px -1px 0 #1d3b6b, -1px 1px 0 #1d3b6b;
  font-variant-numeric: tabular-nums;
}

/* live scores */
.score {
  position: absolute; z-index: 3; top: 84px;
  font-family: var(--font-pixel); font-size: clamp(18px, 5.5vw, 34px);
  color: var(--ink); text-shadow: 3px 3px 0 rgba(0,0,0,.55);
  font-variant-numeric: tabular-nums;
}
.score span { display: block; font-size: .35em; margin-bottom: 6px; letter-spacing: .1em; text-shadow: 1px 1px 0 rgba(0,0,0,.55); }
#score1 { left: 16px; } #score1 span { color: var(--p1-glow); }
#score2 { right: 16px; text-align: right; } #score2 span { color: var(--p2-glow); }

/* join cards */
#cards {
  position: absolute; z-index: 4; left: 16px; right: 16px; bottom: 18px;
  display: flex; justify-content: center; gap: clamp(16px, 8vw, 80px);
  pointer-events: none;
}
.card {
  width: min(40vw, 190px); padding: 12px 10px 10px; border-radius: 14px;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  font-family: var(--font-pixel); font-size: clamp(7px, 2.1vw, 11px); text-align: center; line-height: 1.5;
  box-shadow: 0 6px 0 rgba(0,0,0,.35); transition: transform .2s;
}
.card.p1 { background: var(--p1); }
.card.p2 { background: var(--p2); }
.card svg { width: 64%; height: auto; image-rendering: pixelated; }
.card.ready { animation: bob .6s ease-in-out infinite alternate; }
.card .state { color: var(--gold); }
@keyframes bob { to { transform: translateY(-6px); } }

/* center banners */
#banner {
  position: absolute; z-index: 5; left: 16px; right: 16px; top: 38%;
  text-align: center; font-family: var(--font-pixel); pointer-events: none;
}
#banner h1 {
  margin: 0; font-size: clamp(22px, 8vw, 54px); color: var(--gold); line-height: 1.2;
  text-shadow: 4px 4px 0 #1d3b6b; text-wrap: balance;
}
#banner p { margin: 14px 0 0; font-size: clamp(8px, 2.4vw, 13px); line-height: 1.8; text-shadow: 2px 2px 0 #000; }
#logo { position: absolute; z-index: 4; left: 16px; right: 16px; top: 92px; text-align: center; pointer-events: none; }
#logo div {
  display: inline-block; font-family: var(--font-pixel); font-size: clamp(22px, 7.5vw, 50px); line-height: 1.15;
  color: #fff; text-shadow: 0 5px 0 #b33a26, 4px 9px 0 rgba(0,0,0,.35); transform: rotate(-4deg);
}
#logo small { display: block; font-size: .32em; color: var(--gold); text-shadow: 2px 2px 0 #1d3b6b; margin-bottom: 8px; }

/* results */
#results {
  position: absolute; z-index: 6; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(88vw, 440px); padding: 22px 18px; border-radius: 16px;
  background: var(--shade); text-align: center; font-family: var(--font-pixel);
  display: flex; flex-direction: column; gap: 16px;
}
#results h2 { margin: 0; font-size: clamp(14px, 4.5vw, 24px); color: var(--gold); }
#results .row { display: flex; justify-content: space-around; gap: 12px; }
#results .row div { display: flex; flex-direction: column; gap: 8px; font-size: clamp(8px, 2.4vw, 12px); }
#results .row b { font-size: clamp(20px, 6vw, 34px); font-variant-numeric: tabular-nums; }
#results .r1 { color: var(--p1-glow); } #results .r2 { color: var(--p2-glow); }
#results p { margin: 0; font-size: clamp(7px, 2vw, 10px); line-height: 1.8; }

/* control deck */
#deck {
  position: relative; z-index: 7; background: var(--deck);
  border-top: 4px solid #5ee05a; box-shadow: 0 -6px 22px rgba(94,224,90,.35);
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;
  padding: 12px 16px;
}
.pad { display: flex; align-items: center; justify-content: center; gap: 8px; }
.pad .lbl { font-family: var(--font-pixel); font-size: 8px; letter-spacing: .1em; white-space: nowrap; }
.pad.p1 .lbl { color: var(--p1-glow); } .pad.p2 .lbl { color: var(--p2-glow); }
button { font: inherit; color: inherit; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.tap {
  width: clamp(64px, 18vw, 96px); aspect-ratio: 1; max-width: 100%; border-radius: 50%;
  font-family: var(--font-pixel); font-size: clamp(10px, 3vw, 15px); color: #10131c;
  border: 5px solid #0b0d14; transition: transform .06s, box-shadow .06s;
}
.p1 .tap { background: radial-gradient(circle at 40% 35%, #b9ecff, var(--p1-glow) 55%, #1e74c9); box-shadow: 0 6px 0 #0b3b6e, 0 0 20px var(--p1-glow); }
.p2 .tap { background: radial-gradient(circle at 40% 35%, #ffd0c6, var(--p2-glow) 55%, #b4261a); box-shadow: 0 6px 0 #6e140b, 0 0 20px var(--p2-glow); }
.tap.down { transform: translateY(5px); box-shadow: 0 1px 0 #000 !important; }
.side {
  width: clamp(30px, 8vw, 42px); aspect-ratio: 1; border-radius: 10px; background: #2c3348; color: #c9d2ea;
  font-size: clamp(12px, 3.4vw, 18px); box-shadow: 0 4px 0 #0b0d14;
}
.side:active { transform: translateY(3px); box-shadow: 0 1px 0 #0b0d14; }
#start {
  font-family: var(--font-pixel); font-size: 8px; padding: 10px 10px; border-radius: 6px;
  background: #e9ecf3; color: #10131c; box-shadow: 0 4px 0 #6b7080;
}
#start:active { transform: translateY(3px); box-shadow: 0 1px 0 #6b7080; }
.pad-col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
#keys { font-family: var(--font-pixel); font-size: 7px; color: #7d86a3; text-align: center; line-height: 1.8; }
@media (max-width: 520px) { #keys { display: none; } }
@media (prefers-reduced-motion: reduce) { .card.ready { animation: none; } }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="marquee">
      <div class="hs"><small>ALL TIME BEST</small><b id="best">0</b></div>
      <div class="hs"><small>TODAY'S BEST</small><b id="daily">0</b></div>
    </div>
    <div id="score1" class="score" hidden><span>P1 FROG</span><b>0</b></div>
    <div id="score2" class="score" hidden><span>P2 FOX</span><b>0</b></div>
    <div id="logo"><div><small>ARCADE</small>HOP<br>LANES</div></div>
    <div id="banner" hidden><h1></h1><p></p></div>
    <div id="results" hidden>
      <h2 id="resTitle">GAME OVER</h2>
      <div class="row">
        <div class="r1" id="res1"><span>FROG</span><b>0</b></div>
        <div class="r2" id="res2"><span>FOX</span><b>0</b></div>
      </div>
      <p id="resNote"></p>
    </div>
    <div id="cards">
      <div class="card p1" id="card1">
        <div>PRESS TAP<br>TO JOIN</div>
        <svg id="pic1" viewBox="0 0 12 12" shape-rendering="crispEdges" aria-hidden="true"></svg>
        <div class="state">FREE PLAY</div>
      </div>
      <div class="card p2" id="card2">
        <div>PRESS TAP<br>TO JOIN</div>
        <svg id="pic2" viewBox="0 0 12 12" shape-rendering="crispEdges" aria-hidden="true"></svg>
        <div class="state">FREE PLAY</div>
      </div>
    </div>
  </div>
  <div id="deck">
    <div class="pad p1">
      <button class="side" data-p="0" data-dx="-1" aria-label="Player 1 left">&#9664;</button>
      <div class="pad-col"><button class="tap" id="tap1" data-p="0" aria-label="Player 1 hop forward">TAP</button><span class="lbl">PLAYER 1</span></div>
      <button class="side" data-p="0" data-dx="1" aria-label="Player 1 right">&#9654;</button>
    </div>
    <div class="pad-col">
      <button id="start">START</button>
      <div id="keys">P1 W A S D<br>P2 ARROWS<br>SPACE START</div>
    </div>
    <div class="pad p2">
      <button class="side" data-p="1" data-dx="-1" aria-label="Player 2 left">&#9664;</button>
      <div class="pad-col"><button class="tap" id="tap2" data-p="1" aria-label="Player 2 hop forward">TAP</button><span class="lbl">PLAYER 2</span></div>
      <button class="side" data-p="1" data-dx="1" aria-label="Player 2 right">&#9654;</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';

// ---------- tuning ----------
const PLAY_HALF = 4;          // playable columns: -4..4
const EDGE_DEATH = 5.4;       // carried this far on a log = swept away
const WRAP = 15;              // traffic wraps at +-WRAP
const HOP_TIME = 0.12;
const HIT_PAD = 0.28;         // extra hit width around cars and trains
const TRAIN_SPEED = 26;
const TRAIN_WARN = 1.3;       // seconds the signal flashes before a train
const LANES_AHEAD = 26, LANES_BEHIND = 12;
const CAM_LEAD = 4.2;         // camera looks this many rows past the scroll line
const BEHIND_LIMIT = 4.5;     // fall this far behind the scroll line and you are out
const COUNTDOWN = 3;
const RESULTS_DELAY = 1.1;    // seconds from last death to the results panel (and restart)
const GO_TIME = 0.6;
const TAU = Math.PI * 2;
const $ = id => document.getElementById(id);

// ---------- game state ----------
let state = 'attract', stateT = 0, camRow = 0, playT = 0, countdown = 0, goT = 0;
let bannerKey = '';

// ---------- storage (best effort) ----------
const BEST_KEY = 'hoplanes.best', DAY_PREFIX = 'hoplanes.day.';
const dayKey = () => DAY_PREFIX + new Date().toLocaleDateString('en-CA');   // local YYYY-MM-DD
function load(k) { try { return +localStorage.getItem(k) || 0; } catch (e) { return 0; } }
function save(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) {} }
function dropOldDays() {
  try {
    const keep = dayKey();
    for (let i = localStorage.length - 1; i >= 0; i--) {
      const k = localStorage.key(i);
      if (k && k.startsWith(DAY_PREFIX) && k !== keep) localStorage.removeItem(k);
    }
  } catch (e) {}
}
let bestAll = load(BEST_KEY);
let bestDay = 0;
function refreshBests() {
  bestDay = load(dayKey());
  $('best').textContent = bestAll;
  $('daily').textContent = bestDay;
}
dropOldDays();

// ---------- pixel portraits for the join cards ----------
const PIX = {
  frog: { rows: [
    '............',
    '..WWW..WWW..',
    '..WKW..WKW..',
    '.GGGGGGGGGG.',
    '.GGGGGGGGGG.',
    '.GRRRRRRRRG.',
    '.GGGGGGGGGG.',
    '.GLLLLLLLLG.',
    '.GLLLLLLLLG.',
    '.DD.DD.DD.DD',
    '............',
    '............'],
    pal: { W: '#fff', K: '#111', G: '#4cbf3f', R: '#e0453a', L: '#a6e37a', D: '#2d7a25' } },
  fox: { rows: [
    '.K........K.',
    '.OO......OO.',
    '.OOOOOOOOOO.',
    '.OOKOOOOKOO.',
    '.OOOOOOOOOO.',
    '.OOWWWWWWOO.',
    '.OWWWKKWWWO.',
    '.OOWWWWWWOO.',
    '.OOOWWWWOOO.',
    '.OOOOOOOOOO.',
    '..KK....KK..',
    '............'],
    pal: { O: '#f07a2a', W: '#fff4e6', K: '#1a1a1a' } }
};
function drawPix(svg, art) {
  let s = '';
  art.rows.forEach((r, y) => [...r].forEach((c, x) => {
    if (c !== '.') s += `<rect x="${x}" y="${y}" width="1" height="1" fill="${art.pal[c]}"/>`;
  }));
  svg.innerHTML = s;
}
drawPix($('pic1'), PIX.frog);
drawPix($('pic2'), PIX.fox);

// ---------- audio ----------
let actx = null;
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === 'suspended') actx.resume();
}
function beep(freq, dur, type = 'square', vol = 0.06, slide = 0) {
  if (!actx) return;
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
}
const sfx = {
  hop: id => beep(id ? 520 : 440, 0.07, 'square', 0.04, 200),
  squash: () => beep(160, 0.25, 'sawtooth', 0.08, -120),
  splash: () => beep(900, 0.3, 'triangle', 0.06, -800),
  bell: () => beep(1250, 0.08, 'square', 0.025),
  horn: () => { beep(220, 0.5, 'sawtooth', 0.05); beep(277, 0.5, 'sawtooth', 0.04); },
  join: () => { beep(660, 0.08); setTimeout(() => beep(990, 0.12), 80); },
  go: () => beep(880, 0.25, 'square', 0.06),
  tick: () => beep(440, 0.1, 'square', 0.05)
};

// ---------- three.js setup ----------
const lowPower = matchMedia('(pointer: coarse)').matches;
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(lowPower ? 1.5 : 2, window.devicePixelRatio || 1));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = lowPower ? THREE.PCFShadowMap : THREE.PCFSoftShadowMap;
stage.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x74d3f2);
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 100);
const CAM_OFF = new THREE.Vector3(3.2, 12, 7.5);
const focus = new THREE.Vector3();
const ONE = new THREE.Vector3(1, 1, 1);

scene.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 0.65));
const sun = new THREE.DirectionalLight(0xffffff, 0.6);
sun.castShadow = true;
sun.shadow.mapSize.setScalar(lowPower ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -11, right: 11, top: 15, bottom: -15, near: 1, far: 50 });
scene.add(sun, sun.target);

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  const aspect = w / h;
  const halfW = aspect < 0.8 ? 6.2 : 7.2;
  Object.assign(camera, { left: -halfW, right: halfW, top: halfW / aspect, bottom: -halfW / aspect });
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);   // also catches font loads and deck height changes
resize();

// ---------- merged voxel meshes ----------
// Every model is a list of boxes [w, h, d, color, x, y, z] (y = bottom of the box).
// Each list becomes ONE mesh with vertex colors, so a lane or a car is a single draw call.
const voxelMat = new THREE.MeshLambertMaterial({ vertexColors: true });
const UNIT = new THREE.BoxGeometry(1, 1, 1);
const UP = UNIT.attributes.position.array, UN = UNIT.attributes.normal.array, UI = UNIT.index.array;
const UV = UP.length / 3;
const tmpColor = new THREE.Color();

function mergeBoxes(boxes) {
  const n = boxes.length;
  const pos = new Float32Array(n * UV * 3), nor = new Float32Array(n * UV * 3), col = new Float32Array(n * UV * 3);
  const idx = new (n * UV > 65535 ? Uint32Array : Uint16Array)(n * UI.length);
  boxes.forEach(([w, h, d, color, x, y, z], k) => {
    tmpColor.setHex(color);
    const o = k * UV * 3;
    for (let i = 0; i < UV * 3; i += 3) {
      pos[o + i] = UP[i] * w + x;
      pos[o + i + 1] = UP[i + 1] * h + y + h / 2;
      pos[o + i + 2] = UP[i + 2] * d + z;
      col[o + i] = tmpColor.r; col[o + i + 1] = tmpColor.g; col[o + i + 2] = tmpColor.b;
    }
    nor.set(UN, o);
    for (let i = 0; i < UI.length; i++) idx[k * UI.length + i] = UI[i] + k * UV;
  });
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.setIndex(new THREE.BufferAttribute(idx, 1));
  return g;
}
function voxelMesh(geo, cast = true) {
  const m = new THREE.Mesh(geo, voxelMat);
  m.castShadow = cast; m.receiveShadow = true;
  return m;
}
// shared geometries for models that repeat (never disposed)
const geoCache = new Map();
const cachedGeo = (key, build) => geoCache.get(key) || geoCache.set(key, mergeBoxes(build())).get(key);

// ---------- random ----------
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

// ---------- models (all face -z, which is "forward") ----------
function frogBoxes() {
  const b = [
    [0.62, 0.36, 0.62, 0x4cbf3f, 0, 0.08, 0],
    [0.5, 0.06, 0.5, 0xa6e37a, 0, 0.02, 0],          // belly
    [0.5, 0.05, 0.04, 0xe0453a, 0, 0.22, -0.31]       // mouth
  ];
  for (const s of [-1, 1]) b.push(
    [0.2, 0.2, 0.2, 0xffffff, s * 0.17, 0.42, -0.16],  // eyes
    [0.08, 0.1, 0.06, 0x111111, s * 0.17, 0.48, -0.27],
    [0.16, 0.12, 0.3, 0x2d7a25, s * 0.33, 0, 0.12],    // back legs
    [0.1, 0.1, 0.12, 0x2d7a25, s * 0.22, 0, -0.32]);   // front feet
  return b;
}
function foxBoxes() {
  const b = [
    [0.5, 0.5, 0.56, 0xf07a2a, 0, 0.1, 0],
    [0.36, 0.3, 0.06, 0xfff4e6, 0, 0.12, -0.29],      // chest
    [0.26, 0.16, 0.22, 0xfff4e6, 0, 0.3, -0.36],      // snout
    [0.08, 0.07, 0.06, 0x1a1a1a, 0, 0.42, -0.47],     // nose
    [0.18, 0.18, 0.34, 0xf07a2a, 0, 0.25, 0.42],      // tail
    [0.16, 0.16, 0.12, 0xfff4e6, 0, 0.26, 0.64]
  ];
  for (const s of [-1, 1]) b.push(
    [0.07, 0.09, 0.04, 0x1a1a1a, s * 0.15, 0.46, -0.28], // eyes
    [0.14, 0.18, 0.1, 0xf07a2a, s * 0.16, 0.6, -0.05],   // ears
    [0.14, 0.06, 0.1, 0x1a1a1a, s * 0.16, 0.78, -0.05],
    [0.1, 0.12, 0.1, 0x1a1a1a, s * 0.14, 0, -0.12]);     // legs
  return b;
}
const CAR_COLORS = [0xe8513a, 0x3a8ee8, 0xf2c33a, 0x8f5ae0, 0x3ac27a, 0xf27fb0];
function vehicleBoxes(truck, c) {
  const len = truck ? 2.4 : 1.4;
  const b = truck ? [
    [1.7, 0.75, 0.8, 0xeeeeee, 0.3, 0.12, 0],
    [0.6, 0.6, 0.78, c, -0.85, 0.12, 0],
    [0.12, 0.3, 0.66, 0x223344, -1.12, 0.38, 0]
  ] : [
    [1.4, 0.42, 0.78, c, 0, 0.12, 0],
    [0.75, 0.3, 0.66, 0xffffff, 0.08, 0.54, 0],
    [0.06, 0.2, 0.6, 0x223344, -0.3, 0.58, 0]
  ];
  for (const wx of [-len / 2 + 0.3, len / 2 - 0.3]) for (const wz of [-0.38, 0.38])
    b.push([0.3, 0.26, 0.1, 0x222222, wx, 0, wz]);
  return b;
}
const logBoxes = len => [
  [len, 0.26, 0.78, 0x8a5130, 0, -0.16, 0],
  [0.12, 0.27, 0.7, 0xc08a5a, -len / 2 + 0.05, -0.16, 0],
  [0.12, 0.27, 0.7, 0xc08a5a, len / 2 - 0.05, -0.16, 0]
];
const TRAIN_CARS = 4, TRAIN_CAR_LEN = 3, TRAIN_GAP = 0.15;
const TRAIN_LEN = TRAIN_CARS * TRAIN_CAR_LEN + (TRAIN_CARS - 1) * TRAIN_GAP;
function trainBoxes(dir) {
  const b = [];
  for (let i = 0; i < TRAIN_CARS; i++) {
    const x = -TRAIN_LEN / 2 + TRAIN_CAR_LEN / 2 + i * (TRAIN_CAR_LEN + TRAIN_GAP);
    const front = dir > 0 ? i === TRAIN_CARS - 1 : i === 0;
    b.push([TRAIN_CAR_LEN, 0.9, 0.84, front ? 0xd83a3a : 0x3a6fd8, x, 0.12, 0],
           [TRAIN_CAR_LEN - 0.3, 0.2, 0.86, 0xdde6ff, x, 0.62, 0]);
  }
  const wheels = TRAIN_CARS * 2;
  for (let i = 0; i < wheels; i++)
    b.push([0.4, 0.15, 0.9, 0x222222, -TRAIN_LEN / 2 + 0.6 + i * (TRAIN_LEN - 1.2) / (wheels - 1), 0, 0]);
  return b;
}
function makeCharacter(boxesFn, key) {
  const g = new THREE.Group();
  const body = voxelMesh(cachedGeo(key, boxesFn));
  g.add(body); g.userData.body = body;
  return g;
}

// rail signal light: two shared materials, swapped instead of edited
const LIGHT_OFF = new THREE.MeshLambertMaterial({ color: 0x331111 });
const LIGHT_ON = new THREE.MeshLambertMaterial({ color: 0x331111, emissive: 0xff2222 });
const lightGeo = new THREE.BoxGeometry(0.38, 0.2, 0.14);

// ---------- world ----------
let lanes = new Map();
let maxRow = -1;
let worldGroup = new THREE.Group();
scene.add(worldGroup);
let lastKind = 'grass', streak = 0;

function laneKind(r) {
  if (r < 4) return 'grass';
  const diff = Math.min(1, r / 120);
  let k;
  // keep runs of the same type together, like real roads and rivers
  if (lastKind !== 'grass' && streak < (lastKind === 'road' ? 4 : 3) && Math.random() < 0.55) k = lastKind;
  else {
    const w = { grass: 0.32 - diff * 0.12, road: 0.36, river: 0.2 + diff * 0.06, rail: 0.12 + diff * 0.06 };
    let x = Math.random() * (w.grass + w.road + w.river + w.rail);
    k = 'rail';
    for (const key of ['grass', 'road', 'river']) { if ((x -= w[key]) < 0) { k = key; break; } }
    if (k === 'grass' && lastKind === 'grass') k = pick(['road', 'river']);
  }
  streak = k === lastKind ? streak + 1 : 1;
  lastKind = k;
  return k;
}

// moving things in a lane share one wrap span so their gaps never drift
function fillTraffic(lane, count, z, makeObj) {
  const spacing = lane.span / count;
  const x0 = rand(-lane.span / 2, -lane.span / 2 + 3);
  for (let i = 0; i < count; i++) {
    const o = makeObj(spacing);
    o.x = x0 + i * spacing + (o.jitter || 0);
    o.mesh.position.set(o.x, 0, z);
    lane.group.add(o.mesh); lane.objs.push(o);
  }
}

function addLane(r) {
  const kind = laneKind(r);
  const prev = lanes.get(r - 1);
  const z = -r;
  const lane = {
    r, kind, group: new THREE.Group(), objs: [], trees: new Set(),
    dir: Math.random() < 0.5 ? 1 : -1, speed: 0, span: WRAP * 2 + 4
  };
  const diff = Math.min(1, r / 150);
  const ground = [];   // static boxes, merged into one mesh at the end

  if (kind === 'grass') {
    ground.push([40, 0.3, 1, r % 2 ? 0xb7e05a : 0xaedb4f, 0, -0.3, z]);
    let inPlay = 0;
    for (let x = -12; x <= 12; x++) {
      const out = Math.abs(x) > PLAY_HALF;
      // column 0 never gets a tree, so there is always a way forward
      const tree = out ? Math.random() < 0.85
        : r > 1 && x !== 0 && inPlay < 4 && Math.random() < 0.16 + diff * 0.08;
      if (!tree) continue;
      if (!out) inPlay++;
      lane.trees.add(x);
      ground.push([0.3, 0.3, 0.3, 0x7a4b2a, x, 0, z], [0.72, pick([0.6, 0.9, 1.2, 1.5]), 0.72, 0xa9cf3a, x, 0.3, z]);
    }
  } else if (kind === 'road') {
    ground.push([40, 0.3, 1, 0x4a4f5c, 0, -0.3, z]);
    if (prev && prev.kind === 'road')
      for (let x = -12; x <= 12; x += 2) ground.push([0.8, 0.02, 0.08, 0xe8e8e8, x, 0, z + 0.5]);
    lane.speed = rand(1.6, 2.8) + diff * 2.4;
    const truck = Math.random() < 0.3, len = truck ? 2.4 : 1.4;
    const rot = lane.dir > 0 ? 0 : Math.PI;
    fillTraffic(lane, Math.floor(rand(2, 4) + diff * 1.5), z, spacing => {
      const c = pick(CAR_COLORS);
      const mesh = voxelMesh(cachedGeo(`car${truck}${c}`, () => vehicleBoxes(truck, c)));
      mesh.rotation.y = rot;
      return { mesh, len, jitter: rand(0, spacing * 0.35) };
    });
  } else if (kind === 'river') {
    ground.push([40, 0.3, 1, 0x5ec8f0, 0, -0.45, z]);
    if (prev && prev.kind === 'river') lane.dir = -prev.dir;
    lane.speed = rand(1.0, 1.9) + diff * 1.0;
    fillTraffic(lane, Math.max(3, Math.floor(rand(4, 6) - diff * 2)), z, () => {
      const len = pick([2, 3, 3, 4]) - (diff > 0.6 && Math.random() < 0.5 ? 1 : 0);
      return { mesh: voxelMesh(cachedGeo('log' + len, () => logBoxes(len))), len };
    });
  } else if (kind === 'rail') {
    ground.push([40, 0.3, 1, 0x7b6f6a, 0, -0.3, z]);
    for (let x = -14; x <= 14; x += 0.7) ground.push([0.18, 0.06, 0.9, 0x5a3d2a, x, 0, z]);
    const poleX = PLAY_HALF + 0.6;
    ground.push([40, 0.06, 0.08, 0x9aa3b5, 0, 0.05, z - 0.28], [40, 0.06, 0.08, 0x9aa3b5, 0, 0.05, z + 0.28],
                [0.12, 1.3, 0.12, 0xeeeeee, poleX, 0, z + 0.45]);
    lane.light = new THREE.Mesh(lightGeo, LIGHT_OFF);
    lane.light.position.set(poleX, 1.2, z + 0.45);
    lane.group.add(lane.light);
    Object.assign(lane, { timer: rand(2, 6), warned: false, lastBell: -1 });
    lane.train = { mesh: voxelMesh(cachedGeo('train' + lane.dir, () => trainBoxes(lane.dir))), len: TRAIN_LEN, x: 99, active: false };
    lane.train.mesh.position.set(99, 0, z);
    lane.train.mesh.visible = false;
    lane.group.add(lane.train.mesh);
  }
  lane.ground = voxelMesh(mergeBoxes(ground));   // unique per lane, disposed with the lane
  lane.group.add(lane.ground);
  worldGroup.add(lane.group);
  lanes.set(r, lane);
  maxRow = Math.max(maxRow, r);
}

function dropLane(lane) {
  worldGroup.remove(lane.group);
  lane.ground.geometry.dispose();
  lanes.delete(lane.r);
}

const near = r => state === 'play' && Math.abs(r - camRow) < 14;

function updateLanes(dt, now) {
  for (const lane of lanes.values()) {
    if (lane.kind === 'road' || lane.kind === 'river') {
      const half = lane.span / 2, step = lane.dir * lane.speed * dt, river = lane.kind === 'river';
      for (const o of lane.objs) {
        o.x += step;
        if (o.x > half) o.x -= lane.span;
        else if (o.x < -half) o.x += lane.span;
        o.mesh.position.x = o.x;
        if (river) o.mesh.position.y = Math.sin(now / 400 + o.x) * 0.02;
      }
    } else if (lane.kind === 'rail') {
      const tr = lane.train;
      let on;
      if (!tr.active) {
        lane.timer -= dt;
        const blink = Math.floor(lane.timer * 8);
        on = lane.timer < TRAIN_WARN && blink % 2 === 0;
        if (lane.timer < TRAIN_WARN && !lane.warned) { lane.warned = true; if (near(lane.r)) sfx.horn(); }
        if (on && blink !== lane.lastBell && near(lane.r)) { lane.lastBell = blink; sfx.bell(); }
        if (lane.timer <= 0) {
          tr.active = true; tr.mesh.visible = true;
          tr.x = -lane.dir * (WRAP + tr.len / 2 + 2);
        }
      } else {
        tr.x += lane.dir * TRAIN_SPEED * dt;
        tr.mesh.position.x = tr.x;
        on = Math.floor(now / 120) % 2 === 1;
        if (Math.abs(tr.x) > WRAP + tr.len / 2 + 3) {
          tr.active = false; tr.mesh.visible = false; lane.warned = false;
          lane.timer = rand(3.5, 8);
        }
      }
      lane.light.material = on ? LIGHT_ON : LIGHT_OFF;
    }
  }
}

function resetWorld() {
  for (const lane of [...lanes.values()]) dropLane(lane);
  maxRow = -1; lastKind = 'grass'; streak = 0;
  for (let r = -8; r < LANES_AHEAD; r++) addLane(r);
}
function ensureLanes() {
  while (maxRow < camRow + LANES_AHEAD) addLane(maxRow + 1);
  for (const lane of lanes.values()) if (lane.r < camRow - LANES_BEHIND) dropLane(lane);
}

// ---------- players ----------
const players = [
  { id: 0, boxes: frogBoxes, key: 'frog', startX: -2, joined: false, scoreEl: $('score1').querySelector('b') },
  { id: 1, boxes: foxBoxes, key: 'fox', startX: 2, joined: false, scoreEl: $('score2').querySelector('b') }
];
function spawn(p) {
  if (p.mesh) scene.remove(p.mesh);
  p.mesh = makeCharacter(p.boxes, p.key);
  scene.add(p.mesh);
  Object.assign(p, {
    x: p.startX, row: 0, alive: true, hop: null, queue: null, score: 0,
    facing: 0, cause: '', log: null, logOff: 0, trainDir: 0
  });
  p.mesh.position.set(p.x, 0, 0);
  p.scoreEl.textContent = '0';
}
function despawn(p) { if (p.mesh) { scene.remove(p.mesh); p.mesh = null; } p.alive = false; }

function tryMove(p, dx, dr) {
  if (!p.alive) return;
  if (p.hop) { p.queue = [dx, dr]; return; }
  // rotation.y: 0 = forward (-z), PI = back, +PI/2 = left, -PI/2 = right
  p.facing = dr > 0 ? 0 : dr < 0 ? Math.PI : (dx > 0 ? -Math.PI / 2 : Math.PI / 2);
  const lane = lanes.get(p.row + dr);
  if (!lane) return;
  let tx = p.x + dx;
  if (lane.kind === 'river') { if (Math.abs(tx) > PLAY_HALF + 0.5) return; }
  else {
    tx = Math.round(tx);
    if (Math.abs(tx) > PLAY_HALF) return;
    if (lane.kind === 'grass' && lane.trees.has(tx)) return;
  }
  if (p.row + dr < camRow - BEHIND_LIMIT) return;
  p.hop = { t: 0, fx: p.x, fz: -p.row, tx, tz: -(p.row + dr) };
  p.row += dr;
  if (p.row > p.score) { p.score = p.row; p.scoreEl.textContent = p.score; }
  sfx.hop(p.id);
}

function kill(p, cause) {
  if (!p.alive) return;
  p.alive = false; p.cause = cause; p.hop = null;
  if (cause === 'squash') p.mesh.userData.body.scale.set(1.35, 0.15, 1.35);
  if (cause === 'splash') { sfx.splash(); splash(p.mesh.position.x, -p.row); }
  else sfx.squash();
  checkOver();
}

const parts = [];
const partGeo = new THREE.BoxGeometry(0.14, 0.14, 0.14), partMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
function splash(x, z) {
  for (let i = 0; i < 12; i++) {
    const m = new THREE.Mesh(partGeo, partMat);
    m.position.set(x, 0, z);
    m.userData.v = new THREE.Vector3(rand(-2, 2), rand(3, 5), rand(-2, 2));
    scene.add(m); parts.push(m);
  }
}
function updateParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const m = parts[i];
    m.userData.v.y -= 14 * dt;
    m.position.addScaledVector(m.userData.v, dt);
    if (m.position.y < -1) { scene.remove(m); parts.splice(i, 1); }
  }
}

function turnToward(m, target, dt) {
  let d = (target - m.rotation.y) % TAU;
  if (d > Math.PI) d -= TAU; else if (d < -Math.PI) d += TAU;
  m.rotation.y += d * Math.min(1, dt * 25);
}

function updatePlayer(p, dt) {
  if (!p.mesh) return;
  const m = p.mesh, body = m.userData.body;
  turnToward(m, p.facing, dt);

  if (!p.alive) {
    if (p.cause === 'splash') m.position.y = Math.max(-1.2, m.position.y - dt * 2.5);
    else if (p.cause === 'swept') { m.position.y -= dt * 4; m.position.x += Math.sign(m.position.x) * dt * 2; }
    else if (p.cause === 'train') { m.position.x += p.trainDir * dt * TRAIN_SPEED; m.rotation.z += dt * 12; }
    return;
  }

  const lane = lanes.get(p.row);
  if (p.hop) {
    const h = p.hop;
    h.t += dt / HOP_TIME;
    const t = Math.min(1, h.t);
    p.x = h.fx + (h.tx - h.fx) * t;
    m.position.set(p.x, Math.sin(t * Math.PI) * 0.45, h.fz + (h.tz - h.fz) * t);
    body.scale.copy(ONE);
    if (t >= 1) {
      p.hop = null;
      p.log = null;
      if (lane && lane.kind === 'river') {
        const log = lane.objs.find(o => Math.abs(o.x - p.x) < o.len / 2 + 0.05);
        if (!log) { kill(p, 'splash'); return; }
        // snap to the centre of the nearest log segment so standing feels solid
        const k = (log.len - 1) / 2;
        p.logOff = THREE.MathUtils.clamp(Math.round(p.x - log.x + k) - k, -k, k);
        p.log = log;
      } else p.x = Math.round(p.x);
      body.scale.set(1.15, 0.8, 1.15);
      if (p.queue) { const [qx, qr] = p.queue; p.queue = null; tryMove(p, qx, qr); }
    }
  } else {
    body.scale.lerp(ONE, Math.min(1, dt * 14));
    if (p.log) {
      p.x = p.log.x + p.logOff;
      m.position.x = p.x; m.position.y = 0.1;
      if (Math.abs(p.x) > EDGE_DEATH) { kill(p, 'swept'); return; }
    } else m.position.y = 0;
  }

  if (!lane) return;
  if (lane.kind === 'road') {
    for (const o of lane.objs) if (Math.abs(o.x - p.x) < o.len / 2 + HIT_PAD) { kill(p, 'squash'); return; }
  } else if (lane.kind === 'rail' && lane.train.active) {
    if (Math.abs(lane.train.x - p.x) < lane.train.len / 2 + HIT_PAD) { p.trainDir = lane.dir; kill(p, 'train'); return; }
  }
  if (p.row < camRow - BEHIND_LIMIT) kill(p, 'slow');
}

// ---------- screens ----------
const banner = $('banner'), bannerH = banner.querySelector('h1'), bannerP = banner.querySelector('p');
function setBanner(h, sub = '') {
  const key = h + '|' + sub;
  if (key === bannerKey) return;      // only touch the DOM when the text changes
  bannerKey = key;
  banner.hidden = !h;
  bannerH.textContent = h; bannerP.textContent = sub;
}
function setCard(i) {
  const c = $('card' + (i + 1)), p = players[i];
  c.classList.toggle('ready', p.joined && state === 'countdown');
  c.style.visibility = state === 'play' || state === 'over' ? 'hidden' : 'visible';
  c.firstElementChild.innerHTML = p.joined ? 'READY!' : 'PRESS TAP<br>TO JOIN';
  c.lastElementChild.textContent = p.joined ? 'PLAYER ' + (i + 1) : 'FREE PLAY';
}
const setCards = () => { setCard(0); setCard(1); };

function toAttract() {
  state = 'attract'; stateT = 0; camRow = 0;
  players.forEach(p => { p.joined = false; despawn(p); });
  resetWorld();
  refreshBests();
  $('results').hidden = true; $('logo').hidden = false;
  $('score1').hidden = $('score2').hidden = true;
  setBanner('');
  setCards();
}
function join(i) {
  const p = players[i];
  if (p.joined) return;
  p.joined = true; sfx.join();
  spawn(p);
  if (state === 'attract') { state = 'countdown'; countdown = COUNTDOWN; }
  else countdown = Math.max(countdown, 2.5);
  $('logo').hidden = true;
  setCards();
}
function startPlay() {
  state = 'play'; playT = 0; goT = GO_TIME; sfx.go();
  setBanner('GO!');
  players.forEach((p, i) => { $('score' + (i + 1)).hidden = !p.joined; });
  setCards();
}
function checkOver() {
  if (state !== 'play' || players.some(p => p.joined && p.alive)) return;
  state = 'over'; stateT = 0;
  setBanner('');
  const [p1, p2] = players;
  const top = Math.max(p1.joined ? p1.score : 0, p2.joined ? p2.score : 0);
  let note = '';
  if (top > bestAll) { bestAll = top; save(BEST_KEY, top); note = 'NEW ALL TIME BEST!'; }
  if (top > load(dayKey())) { save(dayKey(), top); note = note || 'NEW BEST TODAY!'; }
  refreshBests();
  $('resTitle').textContent = !(p1.joined && p2.joined) ? 'GAME OVER'
    : p1.score === p2.score ? 'TIE GAME!'
    : p1.score > p2.score ? 'FROG WINS!' : 'FOX WINS!';
  $('res1').hidden = !p1.joined; $('res2').hidden = !p2.joined;
  $('res1').querySelector('b').textContent = p1.score;
  $('res2').querySelector('b').textContent = p2.score;
  $('resNote').textContent = (note ? note + ' ' : '') + 'PRESS TAP TO PLAY AGAIN';
}

// ---------- input ----------
const canRestart = () => state === 'over' && stateT > RESULTS_DELAY;
function press(i, dx, dr) {
  audio();
  if (state === 'attract' || state === 'countdown') join(i);
  else if (state === 'play') { if (players[i].joined) tryMove(players[i], dx, dr); }
  else if (canRestart()) { toAttract(); join(i); }
}
function pressStart() {
  audio();
  if (state === 'attract') join(0);
  else if (state === 'countdown') countdown = Math.min(countdown, 0.01);
  else if (canRestart()) toAttract();
}

const KEYS = {
  KeyW: [0, 0, 1], KeyS: [0, 0, -1], KeyA: [0, -1, 0], KeyD: [0, 1, 0],
  ArrowUp: [1, 0, 1], ArrowDown: [1, 0, -1], ArrowLeft: [1, -1, 0], ArrowRight: [1, 1, 0]
};
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  const k = KEYS[e.code];
  if (k) { e.preventDefault(); press(...k); }
  else if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); pressStart(); }
});
document.querySelectorAll('.tap').forEach(btn => {
  const i = +btn.dataset.p;
  btn.addEventListener('pointerdown', e => { e.preventDefault(); btn.classList.add('down'); press(i, 0, 1); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => btn.addEventListener(t, () => btn.classList.remove('down')));
});
document.querySelectorAll('.side').forEach(btn => {
  btn.addEventListener('pointerdown', e => { e.preventDefault(); press(+btn.dataset.p, +btn.dataset.dx, 0); });
});
$('start').addEventListener('click', pressStart);
document.addEventListener('contextmenu', e => e.preventDefault());

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
  last = now; stateT += dt;

  if (state === 'countdown') {
    const before = Math.ceil(countdown);
    countdown -= dt;
    const n = Math.ceil(countdown);
    if (n !== before && n > 0) sfx.tick();
    if (countdown <= 0) startPlay();
    else setBanner(String(n), players.every(p => p.joined) ? 'FROG VS FOX' : 'OTHER PLAYER: PRESS TAP TO JOIN');
  } else if (state === 'play') {
    playT += dt;
    if (goT > 0 && (goT -= dt) <= 0) setBanner('');
    let lead = -Infinity;
    for (const p of players) if (p.joined && p.alive) lead = Math.max(lead, p.row);
    // the camera creeps forward on its own, and catches up fast to a player who runs ahead
    camRow += Math.min(1.1, 0.3 + playT * 0.006) * dt;
    if (lead - 2 > camRow) camRow += (lead - 2 - camRow) * Math.min(1, dt * 3);
  } else if (state === 'over' && stateT > RESULTS_DELAY) {
    $('results').hidden = false;
  }

  ensureLanes();
  updateLanes(dt, now);
  for (const p of players) updatePlayer(p, dt);
  updateParts(dt);

  // camera: look a few rows ahead of the scroll line
  focus.set(0, 0, -(camRow + CAM_LEAD));
  camera.position.copy(focus).add(CAM_OFF);
  camera.lookAt(focus);
  sun.position.set(focus.x - 6, 14, focus.z + 6);
  sun.target.position.copy(focus);

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

if (location.hash === '#debug') {
  window.hopLanes = { players, renderer, get state() { return state; }, get camRow() { return camRow; } };
}
toAttract();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
